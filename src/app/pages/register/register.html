<h1>Criar conta</h1>

<form (ngSubmit)="register()">
  <div>
    <label for="name">Nome</label>
    <input
      id="name"
      name="name"
      type="text"
      [(ngModel)]="name"
    >
  </div>

  <div>
    <label for="email">E-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
    >
  </div>

  <div>
    <label for="password">Senha</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
    >
  </div>

  <button type="submit">
    Criar conta
  </button>
</form>
