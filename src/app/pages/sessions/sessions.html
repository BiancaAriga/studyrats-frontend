<div class="container-fluid p-4">

  <h1 class="fw-bold mb-4">
    Sessões de estudo
  </h1>

  <div class="row g-3">

    @for (session of sessions(); track session.id) {

      <div class="col-12">

        <section class="session-card rounded-3 p-4 app-card">

          @if (editingSessionId === session.id) {

            <form (ngSubmit)="updateSession()">

              <h2 class="h5 fw-bold mb-4">
                Editar sessão
              </h2>

              <div class="mb-3">
                <label
                  for="edit-subject"
                  class="form-label fw-semibold"
                >
                  Matéria
                </label>

                <input
                  id="edit-subject"
                  name="editSubject"
                  type="text"
                  class="form-control"
                  [(ngModel)]="editSubject"
                  required
                >
              </div>

              <div class="mb-4">
                <label
                  for="edit-duration"
                  class="form-label fw-semibold"
                >
                  Duração (minutos)
                </label>

                <input
                  id="edit-duration"
                  name="editDuration"
                  type="number"
                  class="form-control"
                  [(ngModel)]="editDuration"
                  min="1"
                  required
                >
              </div>

              <div class="d-flex justify-content-end gap-2">

                <button
                  type="button"
                  class="btn btn-secondary"
                  (click)="editingSessionId = null"
                >
                  Cancelar
                </button>

                <button
                  type="submit"
                  class="btn btn-primary"
                >
                  Salvar
                </button>

              </div>

            </form>

          } @else {

            <div class="d-flex align-items-center justify-content-between">

              <div>

                <h2 class="h5 fw-bold mb-2">
                  {{ session.subject }}
                </h2>

                <p class="d-flex align-items-center gap-2 text-muted mb-0">
                  <i
                    class="bi bi-clock"
                    aria-hidden="true"
                  ></i>

                  <span>
                    {{ session.duration }} minutos
                  </span>
                </p>

              </div>

              <div class="d-flex gap-2">

                <button
                  type="button"
                  class="btn btn-outline-primary d-flex align-items-center gap-2"
                  (click)="startEditing(session)"
                >
                  <i
                    class="bi bi-pencil"
                    aria-hidden="true"
                  ></i>

                  Editar
                </button>

                <button
                  type="button"
                  class="btn btn-outline-danger d-flex align-items-center gap-2"
                  (click)="deleteSession(session.id)"
                >
                  <i
                    class="bi bi-trash"
                    aria-hidden="true"
                  ></i>

                  Excluir
                </button>

              </div>

            </div>

          }

        </section>

      </div>

    }

  </div>

</div>
