<h1>Minhas sessões</h1>

@if (sessions().length === 0) {
  <p>Nenhuma sessão de estudo registrada.</p>
} @else {
  <ul>
    @for (session of sessions(); track session.id) {
      <li>
        @if (editingSessionId === session.id) {
          <form (ngSubmit)="updateSession()">
            <div>
              <label for="edit-subject">Matéria</label>

              <input
                id="edit-subject"
                name="editSubject"
                type="text"
                [(ngModel)]="editSubject"
              >
            </div>

            <div>
              <label for="edit-duration">Duração</label>

              <input
                id="edit-duration"
                name="editDuration"
                type="number"
                [(ngModel)]="editDuration"
              >
            </div>

            <button type="submit">
              Salvar
            </button>
          </form>
        } @else {
          <strong>{{ session.subject }}</strong>
          — {{ session.duration }} minutos

          <button
            type="button"
            (click)="startEditing(session)"
          >
            Editar
          </button>
          <button
            type="button"
            (click)="deleteSession(session.id)"
          >
            Excluir
          </button>
        }
      </li>
    }
  </ul>
}
