<h1>Login</h1>

<form (ngSubmit)="login()">
  <div>
    <label for="email">E-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
    >
  </div>

  <div>
    <label for="password">Senha</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
    >
  </div>

  <button type="submit">Entrar</button>
</form>
