<aside class="border-end h-100 d-flex flex-column">

  <!-- Logo -->
  <div class="border-bottom">
    <div class="p-3 d-flex align-items-center">
      <i
        class="bi bi-journal logo-icon me-2 rounded-3 p-2 fs-5"
        aria-hidden="true"
      ></i>

      <span class="fw-bold fs-4">
        StudyRats
      </span>
    </div>
  </div>

  <!-- Navegação -->
  <nav class="m-3 d-flex flex-column gap-2">

    <a
      class="sidebar__link text-decoration-none fw-bold p-2 rounded-3"
      routerLink="/dashboard"
      routerLinkActive="sidebar__link--active"
    >
      <i class="bi bi-speedometer2 me-2" aria-hidden="true"></i>
      Dashboard
    </a>

    <a
      class="sidebar__link text-decoration-none fw-bold p-2 rounded-3"
      routerLink="/check-in"
      routerLinkActive="sidebar__link--active"
    >
      <i class="bi bi-calendar me-2" aria-hidden="true"></i>
      Check-in
    </a>

    <a
      class="sidebar__link text-decoration-none fw-bold p-2 rounded-3"
      routerLink="/sessoes"
      routerLinkActive="sidebar__link--active"
    >
      <i class="bi bi-journal-check me-2" aria-hidden="true"></i>
      Sessões
    </a>

    <a
      class="sidebar__link text-decoration-none fw-bold p-2 rounded-3"
      routerLink="/ranking"
      routerLinkActive="sidebar__link--active"
    >
      <i class="bi bi-trophy me-2" aria-hidden="true"></i>
      Ranking
    </a>

  </nav>

  <!-- Usuário -->
  <div class="mt-auto p-3 border-top d-flex justify-content-between align-items-center">

    <div class="d-flex align-items-center">
      <i
        class="bi bi-person-circle fs-4 me-2"
        aria-hidden="true"
      ></i>

      <span class="fw-semibold">
        {{ userName() }}
      </span>
    </div>

    <button
      type="button"
      class="logout-button"
      (click)="logout()"
      aria-label="Sair"
    >
      <i
        class="bi bi-box-arrow-right"
        aria-hidden="true"
      ></i>
    </button>

  </div>

</aside>
